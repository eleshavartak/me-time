<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Splash screen -->
  <div id="splash-screen">
    <div class="splash-glow"></div>
    <p class="splash-title">Me Time</p>
    <p class="splash-sub">This moment is yours.</p>
  </div>

  <main>

    <!-- Screen 1: Warm intro -->
    <section id="intro-screen" hidden>
      <div class="intro-content">
        <h1 class="intro-title">Me Time</h1>
        <p class="intro-body">Take some time for yourself.<br>Even a few minutes counts.</p>
        <button id="intro-next-btn" class="done-btn">I'm ready</button>
      </div>
    </section>

    <!-- Screen 2: Pick a time -->
    <section id="picker-screen" hidden>
      <header class="intro">
        <h1>Me Time</h1>
        <p class="subtitle">Roughly how much time do you have?</p>
      </header>
      <div class="time-picker">
        <button class="time-btn" data-tier="2min">2 minutes</button>
        <button class="time-btn" data-tier="5min">5 minutes</button>
        <button class="time-btn" data-tier="15min">15 minutes</button>
        <button class="time-btn" data-tier="30min">30 minutes</button>
        <button class="time-btn" data-tier="60min">60 minutes</button>
      </div>
    </section>

    <!-- Screen 3: Before check-in -->
    <section id="before-screen" hidden>
      <header class="result-head">
        <p class="eyebrow">Before you begin</p>
        <p class="checkin-title">How are you feeling right now?</p>
      </header>
      <div class="emoji-picker" id="before-picker"></div>
    </section>

    <!-- Screen 4: Activity -->
    <section id="result-screen" hidden>
      <button id="back-btn" class="back-btn">← Back</button>
      <div class="activity-content">
        <h2 id="activity-name"></h2>
      </div>
      <div class="result-actions">
        <button id="done-btn" class="done-btn">Done — how do I feel now?</button>
        <button id="shuffle-btn" class="ghost-btn">Try something else</button>
      </div>
    </section>

    <!-- Screen 5: After check-in -->
    <section id="after-screen" hidden>
      <header class="result-head">
        <p class="eyebrow">You did it</p>
        <p class="checkin-title">How do you feel now?</p>
      </header>
      <div class="emoji-picker" id="after-picker"></div>
      <div id="toast" class="toast" hidden>
        <span class="toast-icon">✦</span> Saving for future recommendations
      </div>
      <button id="again-btn" class="ghost-btn after-again-btn" hidden>Need some more me time?</button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
